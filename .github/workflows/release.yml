name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.2.3) - tag must already exist"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version to release (e.g., v1.2.3) - tag must already exist"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # whisper.go is a library, with nothing to build: the release is its notes.
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format '$VERSION'"
            echo "Expected format: vX.Y.Z (e.g., v1.2.3)"
            exit 1
          fi
          echo "Version format valid: $VERSION"

      - name: Publish the GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          wasm=$(sed -n 's|^require github.com/mpyw/whisper.go-wasm \(v[^ ]*\)$|\1|p;s|^\tgithub.com/mpyw/whisper.go-wasm \(v[^ ]*\)$|\1|p' go.mod)
          if [[ -z "$wasm" ]]; then
            echo "Error: go.mod requires no whisper.go-wasm"
            exit 1
          fi
          notes=$(mktemp)
          {
            echo '```sh'
            echo "go get github.com/mpyw/whisper.go@$VERSION"
            echo '```'
            echo
            echo "Built on [whisper.go-wasm $wasm](https://github.com/mpyw/whisper.go-wasm/releases/tag/$wasm)."
          } > "$notes"
          gh release create "$VERSION" --verify-tag --title "$VERSION" \
            --notes-file "$notes" --generate-notes
